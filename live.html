<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stop microbes · Jeux en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#120d2b;--panel:#1d1645;--panel2:#271d5c;--line:#3a2f74;--ink:#f3efff;--muted:#b3aadb;--uv:#8cffb4;--cyan:#6ff3ff;--hot:#ff5c8a;--warm:#ffc94a;--blue:#4dabff;--violet:#b48cff;
  --fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Atkinson Hyperlegible",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
#root{height:100%}
body{background:var(--bg);color:var(--ink);font:400 clamp(15px,1.1vw,19px)/1.45 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 85% -10%,#4a2a7e 0%,transparent 60%),radial-gradient(800px 520px at -10% 110%,#0e403c 0%,transparent 60%);pointer-events:none}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;margin:0;line-height:1.05}
.eyebrow{font:700 .74em/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.btn{font:700 .95em/1 var(--fb);border:0;border-radius:99px;padding:13px 20px;background:var(--warm);color:#2b1c00;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px #ffc94a99}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.big{font-size:1.12em;padding:16px 26px}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes floaty{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 14px #ffffff18}}
/* ===== Animateur ===== */
.host{position:relative;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:#120d2bd9;position:relative;z-index:2}
.top .brand{font:800 1.12em/1 var(--fd);display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--ink);text-decoration:none}
.top .brand svg{width:30px;height:30px}
.pill{font:700 .82em/1 var(--fb);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pill.ok{color:var(--uv);border-color:#8cffb455}.pill.warn{color:var(--warm);border-color:#ffc94a66}
.pill .d{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.nb{font:700 .86em/1 var(--fb);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 13px;cursor:pointer;color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;overflow:auto;padding:18px 22px}
.wrap{max-width:1400px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;justify-content:center}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.gcard{text-align:left;background:linear-gradient(160deg,#3a2a52,var(--panel));border:1px solid #ffc94a55;border-radius:26px;padding:24px;cursor:pointer;display:grid;gap:10px;transition:transform .25s,border-color .25s,box-shadow .25s;animation:fadeup .5s both}
.gcard:hover{transform:translateY(-6px);border-color:var(--warm);box-shadow:0 24px 50px -24px #ffc94a70}
.gcard .em{font-size:3em}
.gcard h3{font-size:1.8em}
.gcard p{margin:0;color:var(--muted)}
.lobby{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:26px;align-items:center}
.qrbox{background:#fff;border-radius:26px;padding:20px;display:grid;gap:10px;justify-items:center;color:#1d1a38;animation:pop .5s both}
.qrbox svg{width:100%;height:auto;max-width:360px;display:block}
.qrbox .url{font:700 .78em/1.3 var(--fb);color:#5a5675;word-break:break-all;text-align:center}
.code{font:800 clamp(44px,5vw,76px)/1 var(--fd);letter-spacing:.16em;color:var(--warm);text-shadow:0 0 30px #ffc94a55}
.lobby h1{font-size:clamp(34px,4.4vw,64px)}
.lobby p.big{font-size:1.25em;color:var(--muted);margin:0}
.players{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;align-content:flex-start}
.pl{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1.5px solid var(--c,var(--line));border-radius:99px;padding:7px 14px 7px 7px;font-weight:700;animation:pop .45s both}
.pl i{width:24px;height:24px;border-radius:50%;background:var(--c,#888);display:grid;place-items:center;font:800 .7em/1 var(--fd);color:#120d2b;font-style:normal}
.count{font:800 1.6em/1 var(--fd)}
.count b{color:var(--uv)}
/* question */
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qhead .n{font:800 1.1em/1 var(--fd);color:var(--muted)}
.prog{flex:1;min-width:120px;height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}.prog i{display:block;height:100%;background:var(--warm);transition:width .4s}
.answered{display:flex;align-items:center;gap:8px;font-weight:700}
.answered b{font:800 1.6em/1 var(--fd);color:var(--uv);font-variant-numeric:tabular-nums}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#ffffff18;stroke-width:9}
.ring .fg{fill:none;stroke:var(--warm);stroke-width:9;stroke-linecap:round;stroke-dasharray:263.9}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:800 2.2em/1 var(--fd);font-variant-numeric:tabular-nums}
.ring.warn .fg{stroke:var(--hot)}.ring.warn .t{color:var(--hot)}
.qtext{font:800 clamp(28px,3.4vw,54px)/1.12 var(--fd);text-align:center;max-width:24ch;margin:0 auto;animation:fadeup .5s both;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;background:var(--c);color:#14102e;border-radius:20px;padding:20px 22px;font:800 clamp(18px,1.7vw,28px)/1.15 var(--fd);min-height:96px;animation:pop .45s both;transition:opacity .4s,transform .4s,filter .4s}
.opt .sh{flex:none;width:46px;height:46px;display:grid;place-items:center;font-size:1.4em;background:#ffffff55;border-radius:14px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff55;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.opt .lbl{position:relative;flex:1}
.opt .cnt{position:relative;font:800 1.2em/1 var(--fd);opacity:0;transition:opacity .4s}
.rev .opt .cnt{opacity:1}
.rev .opt:not(.good){opacity:.38;filter:saturate(.4);transform:scale(.97)}
.rev .opt.good{box-shadow:0 0 0 5px #fff,0 0 40px #ffffffaa;transform:scale(1.02)}
.rev .opt.good .sh::after{content:"✓"}
.expl{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px 18px;font-size:1.1em;animation:fadeup .4s both;text-align:center}
.expl b{color:var(--uv)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* tri */
.cat{text-align:center;display:grid;gap:18px;justify-items:center}
.cat h1{font-size:clamp(34px,4.6vw,70px);max-width:20ch;animation:pop .5s both}
.catcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,260px));gap:16px;justify-content:center}
.catcols div{background:color-mix(in srgb,var(--c) 18%,var(--panel));border:2px solid var(--c);border-radius:20px;padding:16px;text-align:center;animation:fadeup .5s both}
.catcols b{display:block;font:800 1.5em/1.1 var(--fd);margin:6px 0}
.catcols span{font-size:2em}
.catcols small{color:var(--muted)}
.card{background:#fff;color:#1d1a38;border-radius:26px;padding:22px 28px;display:flex;align-items:center;gap:20px;max-width:900px;margin:0 auto;box-shadow:0 30px 70px -30px #000c;animation:pop .45s both}
.card .e{font-size:clamp(50px,5.4vw,84px);line-height:1}
.card p{margin:0;font:800 clamp(22px,2.6vw,42px)/1.15 var(--fd);text-wrap:balance}
.tbar{height:10px;border-radius:5px;background:#ffffff14;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--warm),var(--uv));transform-origin:left}
.zone{position:relative;min-height:260px}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;height:100%}
.col{position:relative;border:2.5px solid var(--c);border-radius:22px;background:color-mix(in srgb,var(--c) 12%,transparent);min-height:240px;display:flex;flex-direction:column;align-items:center;padding:14px;transition:box-shadow .4s,opacity .4s,transform .4s}
.col h3{font-size:clamp(20px,2vw,32px);display:flex;gap:10px;align-items:center}
.col .num{font:800 2.4em/1 var(--fd);margin-top:auto;opacity:0;transition:opacity .4s}
.rev .col .num{opacity:1}
.rev .col.good{box-shadow:0 0 0 4px var(--c),0 0 50px var(--c);transform:translateY(-4px)}
.rev .col:not(.good){opacity:.5}
.rev .col.bad{animation:shake .5s}
.tk{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:800 .78em/1 var(--fd);color:#120d2b;box-shadow:0 4px 10px #0007;transition:left .9s cubic-bezier(.3,1.3,.5,1),top .9s cubic-bezier(.3,1.4,.5,1);z-index:3}
/* classement */
.board{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px}
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;position:relative;overflow:hidden;animation:fadeup .45s both}
.rk .b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--c),transparent);opacity:.25;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.rk .p{position:relative;font:800 1.3em/1 var(--fd);text-align:center}
.rk .nm{position:relative;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.rk .nm i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.rk .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sc{position:relative;font:800 1.2em/1 var(--fd);font-variant-numeric:tabular-nums}
.teamsbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:8px;align-content:start}
.teamsbox h3{font-size:1.1em}
.tr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-weight:700}
.tr i{width:18px;height:18px;border-radius:50%;background:var(--c)}
/* podium */
.podium{--ph:min(36vh,300px);display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:14px;justify-content:center;align-items:end}
.step{display:grid;gap:8px;justify-items:center;align-content:end}
.step .nm{font:800 clamp(18px,1.8vw,28px)/1.1 var(--fd);text-align:center;animation:pop .5s both}
.step .sc{color:var(--muted);font-weight:700}
.step .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:14px;font:800 2.6em/1 var(--fd);color:#120d2b;transform-origin:bottom;animation:grow .9s cubic-bezier(.3,1.2,.5,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.warnbox{background:#ffc94a1a;border:1px solid #ffc94a66;border-radius:16px;padding:12px 16px;font-size:.92em;color:var(--ink)}
.warnbox a{color:var(--warm)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* ===== Joueur (téléphone) ===== */
.player{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:16px max(16px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom))}
.player .ph{display:flex;align-items:center;gap:8px;font:800 1em/1 var(--fd);margin-bottom:10px}
.player .ph .me{margin-left:auto;display:flex;gap:6px;align-items:center;font:700 .85em/1 var(--fb);color:var(--muted)}
.player .ph .me i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.pv{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;animation:fadeup .35s both}
.pv h1{font-size:clamp(26px,7vw,40px);text-align:center}
.pv p{margin:0;text-align:center;color:var(--muted)}
.pv input{width:100%;font:800 1.3em/1 var(--fd);padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--panel);text-align:center}
.tpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpick button{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 6px;font:800 1em/1 var(--fd);cursor:pointer;display:grid;justify-items:center;gap:6px}
.tpick button i{width:22px;height:22px;border-radius:50%;background:var(--c)}
.tpick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,var(--panel))}
.pans{display:grid;gap:12px;flex:1}
.pans.q4{grid-template-columns:1fr 1fr}
.pans button{border:0;border-radius:22px;background:var(--c);color:#14102e;font:800 clamp(16px,4.4vw,22px)/1.15 var(--fd);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;cursor:pointer;transition:transform .1s}
.pans button:active{transform:scale(.95)}
.pans button .sh{font-size:1.8em}
.pans button small{font:700 .7em/1.2 var(--fb);opacity:.85}
.big-ic{font-size:clamp(70px,22vw,120px);text-align:center;line-height:1;animation:pop .5s both}
.pts{font:800 clamp(34px,10vw,56px)/1 var(--fd);text-align:center}
.ok .pts{color:var(--uv)}.ko .pts{color:var(--hot)}
.ptimer{height:8px;border-radius:4px;background:#ffffff18;overflow:hidden}.ptimer i{display:block;height:100%;background:var(--warm)}
.floaty{animation:floaty 2.4s ease-in-out infinite;display:inline-block}
@media (max-width:900px){.lobby,.board,.pick{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}

/* ===== Recette du nettoyage (live) ===== */
.srules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1100px;width:100%}
.srules div{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;animation:fadeup .5s both}
.srules span{font-size:1.8em}.srules b{font:800 1.15em/1.15 var(--fd)}.srules small{color:var(--muted)}
.stable{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:minmax(140px,1.6fr) repeat(4,minmax(0,1fr)) 80px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;animation:fadeup .35s both}
.sr.sh{background:none;border:0;color:var(--muted);font-weight:700;font-size:.85em;padding:0 12px}
.sr .nm{display:flex;gap:8px;align-items:center;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sr .nm i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.sr .cell{text-align:center;font-weight:700;color:var(--muted)}.sr .cell b{color:var(--v);font:800 1.1em/1 var(--fd);margin-right:4px}
.sr .cell.cur{animation:pulse 1.2s infinite;border-radius:10px}
.sr .pts{font:800 1.3em/1 var(--fd);text-align:right;color:var(--warm);font-variant-numeric:tabular-nums}
.corr{display:grid;gap:10px}
.cf{display:grid;grid-template-columns:46px minmax(170px,1fr) minmax(0,2.2fr);gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.cf .e{font-size:1.8em;text-align:center}.cf small{display:block;color:var(--muted)}
.trk{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-top:18px}
.trk span{position:relative;height:52px;border-radius:10px;background:#ffffff0a;display:grid;place-items:center}
.trk span.in{background:#8cffb426;outline:2px solid #8cffb4aa}
.trk i{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:800 .95em/1 var(--fd);color:#120d2b;font-style:normal;transform:scale(var(--s));transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.trk em{position:absolute;bottom:-18px;font:700 .75em/1 var(--fb);color:var(--muted);font-style:normal}
.trk .av{position:absolute;top:-4px;transform:translateX(-50%);height:auto;background:none;color:var(--warm);font-size:1.1em}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sstats div{background:var(--panel2);border-radius:16px;padding:12px;text-align:center}.sstats b{display:block;font:800 2em/1 var(--fd);color:var(--uv)}.sstats small{color:var(--muted)}
.smh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.smh b{font:800 1.15em/1.15 var(--fd)}
.smh .tg{font:700 .75em/1 var(--fb);background:#ffc94a22;color:var(--warm);border-radius:99px;padding:6px 10px}
.hintbox{background:#fff;color:#1d1a38;border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.35}
.budget{display:flex;align-items:baseline;gap:6px;justify-content:center;color:var(--muted);font-weight:700}.budget b{font:800 1.8em/1 var(--fd);color:var(--warm)}
.sf{display:grid;grid-template-columns:30px minmax(0,1fr) 52px 52px;gap:8px;align-items:center;background:var(--panel);border:1.5px solid transparent;border-radius:16px;padding:8px 10px}
.sf.hot{border-color:var(--c)}
.sf .e{font-size:1.5em;text-align:center}.sf .n{font-weight:700;line-height:1.15}.sf .n small{display:block;color:var(--muted);font-weight:400;font-size:.8em}
.sf .pips{display:flex;gap:5px;margin-top:5px}.sf .pips i{width:14px;height:14px;border-radius:50%;background:#ffffff1a}.sf .pips i.on{background:var(--c);box-shadow:0 0 8px var(--c)}.sf .pips i.lock{background:repeating-linear-gradient(45deg,#ff5c8a55 0 3px,transparent 3px 6px)}
.sf button{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:800 1.5em/1 var(--fd);cursor:pointer}
.sf button:active{transform:scale(.92)}.sf button:disabled{opacity:.25}
.snotes{display:grid;gap:6px}.snotes div{background:#ffffff0a;border-radius:12px;padding:9px 11px;font-size:.92em;color:var(--muted)}.snotes div b{color:var(--ink)}.snotes .good b{color:var(--uv)}
@media (max-width:900px){.srules,.sstats{grid-template-columns:1fr}.cf{grid-template-columns:40px 1fr}.cf .trk{grid-column:1/-1}.sr{grid-template-columns:minmax(90px,1.4fr) repeat(4,minmax(0,1fr)) 54px;font-size:.85em}}

.achips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.achips span{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;font:700 .8em/1 var(--fb);opacity:.35;filter:grayscale(1);transition:opacity .3s,filter .3s}
.achips span i{width:20px;height:20px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:800 .7em/1 var(--fd);color:#120d2b;font-style:normal}
.achips span.on{opacity:1;filter:none;border-color:var(--c);animation:pop .4s both}
.chosen{background:var(--c);color:#14102e;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;font:800 1.3em/1.2 var(--fd);text-align:center;animation:pop .4s both}
.chosen .sh{font-size:2em}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti"></canvas>
<script>
(function(){

function sScore(m,x){ let pen=0; const notes=[];
  SFAC.forEach(f=>{ const [lo,hi]=m.r[f.k], v=x[f.k]||0;
    if(v<lo){ pen+=(lo-v)*15+(v===0&&lo>=3?10:0); notes.push({f,s:'low',t:SLOW[f.k]}); }
    else if(v>hi){ const per=f.k==='chim'?(m.id==='tetine'?25:10):5; pen+=(v-hi)*per; notes.push({f,s:'high',t:f.k==='chim'?(m.id==='tetine'?'Du produit sur une tétine : Inès avalerait les résidus !':'Trop de produit : irritant pour les enfants, polluant et coûteux.'):'Plus que nécessaire : des jetons gaspillés.'}); }
    else notes.push({f,s:'ok',t:''}); });
  return {pct:Math.max(0,100-pen),notes}; }

/* ---------------- Réseau : Supabase Realtime ou mode test ---------------- */
const Net=(()=>{ let ch=null, bc=null, handler=null, mode='none';
  const waitLib=()=>new Promise(r=>{ let n=0; const t=setInterval(()=>{ if(window.supabase||++n>30){ clearInterval(t); r(!!window.supabase); } },100); });
  async function open(code,onMsg){ handler=onMsg; const cfg=window.SM_CONFIG||{};
    if(cfg.supabaseUrl&&cfg.supabaseAnonKey&&await waitLib()){ try{
      const cl=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{realtime:{params:{eventsPerSecond:40}}});
      ch=cl.channel('stopmicrobes-'+code,{config:{broadcast:{self:false}}});
      ch.on('broadcast',{event:'m'},({payload})=>{ if(handler) handler(payload); });
      await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('délai dépassé')),9000); ch.subscribe(st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); res(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ clearTimeout(to); rej(new Error(st)); } }); });
      mode='online'; return mode; }catch(e){ console.warn('Supabase indisponible',e); mode='error'; } }
    try{ bc=new BroadcastChannel('stopmicrobes-'+code); bc.onmessage=e=>{ if(handler) handler(e.data); }; }catch(e){}
    if(mode!=='error') mode='local'; return mode; }
  function send(m){ try{ if(ch&&mode==='online') ch.send({type:'broadcast',event:'m',payload:m}); else if(bc) bc.postMessage(m); }catch(e){} }
  return {open,send,get mode(){ return mode; }}; })();

const Snd=(()=>{ let ctx=null, on=true; const ac=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ctx.state==='suspended') ctx.resume(); return ctx; };
  function tone(f,d,type,vol,when){ if(!on) return; const c=ac(); if(!c) return; const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.03); }
  return { toggle(){ on=!on; return on; }, join(){ tone(880,.1,'sine',.1); tone(1320,.12,'sine',.08,.07); }, tick(){ tone(1500,.05,'square',.04); }, ans(){ tone(700,.05,'sine',.06); },
    reveal(){ [523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.08)); }, go(){ [392,523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.09)); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.15,i*.11)); tone(1319,.7,'triangle',.11,.48); }, whoosh(){ tone(300,.3,'sine',.06); } }; })();
const Confetti=(()=>{ const cv=$('#confetti'), cx=cv.getContext('2d'); let ps=[], raf=0;
  function burst(n){ const d=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*d; cv.height=innerHeight*d; const cols=['#8cffb4','#ffc94a','#ff7aa8','#6ff3ff','#b48cff','#fff'];
    for(let i=0;i<(n||200);i++) ps.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-5,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*7,h:9+Math.random()*9,c:cols[i%cols.length],l:0});
    if(!raf) raf=requestAnimationFrame(loop); }
  function loop(){ const d=Math.min(2,devicePixelRatio||1); cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=.36; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.l++; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.l*.12))); cx.restore(); });
    ps=ps.filter(p=>p.y<innerHeight+40&&p.l<330); if(ps.length) raf=requestAnimationFrame(loop); else { raf=0; cx.clearRect(0,0,innerWidth,innerHeight); } }
  return {burst}; })();

    const mis=SMIS[k], x={}; let tot=0; SFAC.forEach(f=>{ let v=Math.max(0,Math.min(5,Math.round(Number(m.x&&m.x[f.k])||0))); if(mis.lock[f.k]!=null) v=Math.min(v,mis.lock[f.k]); x[f.k]=v; tot+=v; });
    const spent=a.reduce((s,r)=>s+r.used,0); if(spent+tot>SBUDGET) return;
    const sc=sScore(mis,x); a.push({x,pct:sc.pct,why:Number(m.w)===mis.why.a,used:tot}); H.sres.set(id,a);
    const p=H.players.get(id); p.score=a.reduce((s,r)=>s+r.pct+(r.why?25:0),0); Snd.ans(); renderPlayLater(); broadcast(); }
  document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,textarea,button,a')) return; if([' ','Enter','ArrowRight','PageDown'].includes(e.key)){ const b=$('#hnx')||$('#hgo')||$('#hcorr'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } } });
  const hash=(location.hash||'').slice(1);
  if(GAMES[hash]) create(hash); else pick();
}

/* =====================================================================
   PAGE JOUEUR (téléphone)
   ===================================================================== */
function player(){
  let id=null; try{ id=localStorage.getItem('sm_pid'); }catch(e){} if(!id){ id='p'+Math.random().toString(36).slice(2,10); try{ localStorage.setItem('sm_pid',id); }catch(e){} }
  let name='', team=-1; try{ name=localStorage.getItem('sm_name')||''; team=+(localStorage.getItem('sm_team')??-1); }catch(e){}
  const P={joined:false,st:null,key:'',myAns:{},lastSeen:0};
  $('#root').innerHTML=`<div class="player"><div class="ph">${LOGO.replace('<svg','<svg style="width:26px;height:26px"')}<span>Stop microbes</span><span class="me" id="pme"></span></div><div class="pv" id="pv"></div></div>`;
  const PV=$('#pv');
  function me(){ $('#pme').innerHTML=P.joined?`<i style="--c:${team>=0?TEAMS[team].c:'#9a93c7'}"></i>${esc(name)}`:''; }
  function joinForm(){ P.key='join';
    PV.innerHTML=`<h1>${P.st?esc(P.st.title):'Partie '+JOIN}</h1><p>Partie <b style="color:var(--warm);letter-spacing:.1em">${JOIN}</b></p>
      <input id="pn" maxlength="16" placeholder="Ton prénom ou pseudo" value="${esc(name)}" autocomplete="off">
      <p style="text-align:left;font-weight:700;color:var(--ink)">Ton trinôme :</p>
      <div class="tpick">${TEAMS.map((t,i)=>`<button data-t="${i}" class="${i===team?'on':''}" style="--c:${t.c}"><i></i>${i+1}</button>`).join('')}</div>
      <button class="btn big" id="pj">Rejoindre la partie →</button><p id="pinfo" style="font-size:.85em"></p>`;
    $$('.tpick button').forEach(b=>b.onclick=()=>{ team=+b.dataset.t; $$('.tpick button').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#pj').onclick=()=>{ const v=$('#pn').value.trim(); if(!v){ $('#pn').focus(); $('#pn').style.borderColor='var(--hot)'; return; } name=v.slice(0,16);
      try{ localStorage.setItem('sm_name',name); localStorage.setItem('sm_team',team); }catch(e){} P.joined=true; Net.send({t:'join',id,name,team}); me(); P.key=''; render(); };
    $('#pn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#pj').click(); }); }
  function view(key,html){ if(P.key===key) return false; P.key=key; PV.innerHTML=html; PV.style.animation='none'; void PV.offsetWidth; PV.style.animation=''; return true; }
  function render(){ const s=P.st; if(!P.joined){ if(P.key!=='join') joinForm(); else { const i=$('#pinfo'); if(i) i.textContent=s?'':'En attente de l\'écran d\'Audrey…'; } return; }
    if(!s){ view('wait0',`<div class="big-ic"><span class="floaty">📡</span></div><h1>Connexion…</h1><p>En attente de l'écran d'Audrey.</p>`); return; }
    const inGame=s.ids&&s.ids.includes(id), r=s.res&&s.res[id];
    if(!inGame&&s.ph!=='end'){ view('pend',`<div class="big-ic"><span class="floaty">⏳</span></div><h1>Inscription…</h1><p>Encore une seconde.</p>`); return; }
    if(s.g==='sinner') return renderSinner(s);
    if(s.ph==='lobby') return view('lobby',`<div class="big-ic"><span class="floaty">🦠</span></div><h1>C'est bon, ${esc(name)} !</h1><p>Regarde l'écran : la partie va commencer.</p>`);
    if(s.ph==='cat') return view('cat'+s.n,`<div class="big-ic">🗂️</div><p>Nouvelle manche</p><h1>${esc(s.q)}</h1><p>Regarde l'écran 👀</p>`);
    if(s.ph==='q'){ const mine=P.myAns[s.n];
      const opts=s.kind==='q'?s.opts.map((o,i)=>({t:o,c:OPTC[i],sh:SHAPES[i]})):s.cols.map(c=>({t:c.n,c:c.c,sh:c.e}));
      if(mine!=null){ const o=opts[mine]||{t:'',c:'#888',sh:'?'}; return view('sent'+s.n,`<p style="font-weight:700;color:var(--ink)">${s.kind==='q'?'Question':'Carte'} ${s.num} / ${s.total}</p><p>Ta réponse :</p><div class="chosen" style="--c:${o.c}"><span class="sh">${o.sh}</span><span>${esc(o.t)}</span></div><h1>Réponse envoyée ✓</h1><p>Regarde l'écran pour la révélation 👀</p>`); }
      if(view('q'+s.n,`<p style="font-weight:700;color:var(--ink)">${s.kind==='q'?'Question':'Carte'} ${s.num} / ${s.total}</p><div class="ptimer"><i id="ptb"></i></div><p style="font-size:.95em">${esc(s.q)}</p><div class="pans ${opts.length===4?'q4':''}">${opts.map((o,i)=>`<button data-a="${i}" style="--c:${o.c}"><span class="sh">${o.sh}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`)){
        P.deadline=Date.now()+(s.left||0)*1000; P.limit=s.limit||20;
        $$('.pans button').forEach(b=>b.onclick=()=>{ const a=+b.dataset.a; P.myAns[s.n]=a; try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){} Net.send({t:'ans',id,n:s.n,a}); P.key=''; render(); }); }
      return; }
    if((s.ph==='rev'||s.ph==='board')&&r){ const ok=r.ok, ans=r.ans;
      return view('rev'+s.n+s.ph,`<div class="${ok?'ok':'ko'}" style="display:grid;gap:10px"><div class="big-ic">${ok?'✅':ans<0?'⏰':'❌'}</div><div class="pts">${ok?'+'+r.pts:ans<0?'Trop tard !':'Raté'}</div>${ok?(r.st>1&&s.g==='tri'?`<p>🔥 Série de ${r.st} !</p>`:''):`<p>${ans>=0?`Tu as répondu : <b style="color:var(--hot)">${esc(s.kind==='q'?(s.opts||[])[ans]||'':((s.cols||[])[ans]||{}).n||'')}</b><br>`:''}La bonne réponse : <b style="color:var(--uv)">${esc(s.good||'')}</b></p>`}<p style="font-size:1.1em;color:var(--ink)">${r.tot} points · <b>${r.rk}ᵉ</b> sur ${r.of}</p></div>`); }
    if(s.ph==='end'){ const rk=r?r.rk:null;
      return view('end',`<div class="big-ic">${rk===1?'🏆':rk===2?'🥈':rk===3?'🥉':'🎉'}</div><h1>${rk?`${rk}ᵉ sur ${r.of}`:'Partie terminée'}</h1><p style="font-size:1.2em;color:var(--ink)">${r?r.tot+' points':''}</p><p>Merci d'avoir joué !</p>`); }
    view('wait'+s.ph+s.n,`<div class="big-ic"><span class="floaty">👀</span></div><h1>Regarde l'écran</h1>`); }

  /* ---- La recette du nettoyage : téléphone ---- */
  const SK='sm_s_'+JOIN;
  let S=null; try{ S=JSON.parse(localStorage.getItem(SK)||'null'); }catch(e){}
  if(!S||!Array.isArray(S.res)) S={mi:0,x:{chim:0,meca:0,temp:0,temps:0},stage:'set',res:[],last:null};
  const sSave=()=>{ try{ localStorage.setItem(SK,JSON.stringify(S)); }catch(e){} };
  const sSpent=()=>S.res.reduce((s,r)=>s+r.used,0), sUsed=()=>SFAC.reduce((s,f)=>s+(S.x[f.k]||0),0), sLeft=()=>SBUDGET-sSpent()-sUsed();
  function sSend(k){ const r=S.res[k]; if(r) Net.send({t:'sm',id,m:k,x:r.x,w:r.w}); }
  function sRenderCtl(){ const m=SMIS[S.mi], L=sLeft(), box=$('#sfacs'); if(!box) return;
    box.innerHTML=SFAC.map(f=>{ const cp=m.lock[f.k]!=null?m.lock[f.k]:5, v=S.x[f.k]||0; return `<div class="sf${v?' hot':''}" style="--c:${f.c}"><span class="e">${f.e}</span><div class="n">${f.n}<small>${m.lockWhy&&m.lockWhy[f.k]?'🔒 '+m.lockWhy[f.k]:f.d}</small><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<v?'on':i>=cp?'lock':''}"></i>`).join('')}</div></div><button data-k="${f.k}" data-d="-1" ${v<=0?'disabled':''} aria-label="Moins">−</button><button data-k="${f.k}" data-d="1" ${v>=cp||L<=0?'disabled':''} aria-label="Plus">+</button></div>`; }).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.x[b.dataset.k]=(S.x[b.dataset.k]||0)+(+b.dataset.d); try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} sSave(); sRenderCtl(); });
    $('#sleft').textContent=L; $('#sleftw').textContent=`jeton${L>1?'s':''} pour ${4-S.mi} mission${4-S.mi>1?'s':''}`; $('#sgo').disabled=sUsed()===0; }
  function sMission(){ const m=SMIS[S.mi];
    if(S.stage==='set'){ if(view('s'+S.mi+'set',`<div class="smh"><span class="tg">Mission ${S.mi+1}/4</span><b>${m.em} ${esc(m.name)}</b></div><div class="hintbox">🔎 ${esc(m.hint)}</div><div class="budget">🪙 <b id="sleft"></b> <span id="sleftw"></span></div><div id="sfacs" style="display:grid;gap:8px"></div><button class="btn big" id="sgo">🧽 Nettoyer !</button>`)){
        $('#sgo').onclick=()=>{ if(!sUsed()) return; const sc=sScore(m,S.x); S.last={pct:sc.pct,notes:sc.notes.map(n=>({k:n.f.k,s:n.s,t:n.t})),ord:shuffle([0,1,2])}; S.stage='res'; sSave(); try{ navigator.vibrate&&navigator.vibrate([20,40,20]); }catch(e){} P.key=''; render(); }; }
      sRenderCtl(); return; }
    const L=S.last, fe=k=>SFAC.find(f=>f.k===k).e;
    if(S.stage==='res'){ if(view('s'+S.mi+'res',`<div class="smh"><span class="tg">Mission ${S.mi+1}/4</span><b>${m.em} ${esc(m.name)}</b></div><div class="${L.pct>=95?'ok':'ko'}" style="text-align:center"><div class="pts">${L.pct} %</div><p>propre</p></div>
        <div class="snotes">${L.notes.filter(n=>n.s!=='ok').map(n=>`<div><b>${fe(n.k)} ${n.s==='low'?'↑ Pas assez':'↓ Trop'}</b> · ${esc(n.t)}</div>`).join('')||'<div class="good"><b>✓ Recette juste sur les 4 facteurs !</b></div>'}</div>
        <h3 style="font-size:1.15em">🤔 ${esc(m.why.q)}</h3><div class="pans">${L.ord.map(i=>`<button data-i="${i}" style="--c:#2a2160;color:var(--ink);min-height:64px;border:2px solid var(--line)"><span>${esc(m.why.o[i])}</span></button>`).join('')}</div>`)){
        $$('.pans button').forEach(b=>b.onclick=()=>{ const w=+b.dataset.i; S.res[S.mi]={x:{...S.x},pct:L.pct,w,why:w===m.why.a,used:sUsed()}; S.stage='why'; sSave(); sSend(S.mi); P.key=''; render(); }); }
      return; }
    if(S.stage==='why'){ const r=S.res[S.mi], last=S.mi>=3;
      if(view('s'+S.mi+'why',`<div class="smh"><span class="tg">Mission ${S.mi+1}/4</span><b>${m.em} ${esc(m.name)}</b></div><div class="${r.why?'ok':'ko'}" style="text-align:center"><div class="big-ic" style="font-size:64px">${r.why?'🧠':'🤔'}</div><div class="pts" style="font-size:30px">${r.why?'Bien vu ! +25':'Pas tout à fait'}</div></div>
        <div class="snotes"><div class="good"><b>✅ ${esc(m.why.o[m.why.a])}</b><br>${esc(m.why.x)}</div><div><b>La bonne recette :</b> ${SFAC.map(f=>`${f.e} ${sRange(m.r[f.k])}`).join(' · ')}</div><div><b>Ta recette :</b> ${SFAC.map(f=>`${f.e} ${r.x[f.k]||0}`).join(' · ')} → ${r.pct} %</div></div>
        <button class="btn big" id="snx">${last?'🏁 Terminer':'Mission suivante →'}</button>`)){
        $('#snx').onclick=()=>{ if(last){ S.stage='done'; } else { S.mi++; S.x={chim:0,meca:0,temp:0,temps:0}; S.stage='set'; S.last=null; } sSave(); P.key=''; render(); }; }
      return; }
    const pts=S.res.reduce((s,r)=>s+r.pct+(r.why?25:0),0);
    view('sdone',`<div class="big-ic">🏁</div><h1>Terminé !</h1><p style="font-size:1.3em;color:var(--ink)"><b>${pts}</b> / 500 points</p><div class="snotes">${S.res.map((r,i)=>`<div>${SMIS[i].em} <b>${r.pct} %</b> · pourquoi ${r.why?'✓':'✗'}</div>`).join('')}</div><p>Regarde l'écran : on corrige ensemble 👀</p>`); }
  function renderSinner(s){ const r=s.res&&s.res[id];
    if(s.ph==='lobby') return view('lobby',`<div class="big-ic"><span class="floaty">⭕</span></div><h1>C'est bon, ${esc(name)} !</h1><p>Regarde l'écran : Audrey va expliquer les règles.</p>`);
    if(s.ph==='brief') return view('brief',`<div class="big-ic"><span class="floaty">👂</span></div><h1>Écoute bien les règles</h1><p>4 missions · 26 jetons au total · un « pourquoi ? » à chaque fois.</p>`);
    if(s.ph==='play') return sMission();
    if(s.ph==='corr'){ const k=s.cm|0, mine=S.res[k], m=SMIS[k];
      return view('corr'+k,`<div class="big-ic">${m.em}</div><p>Correction à l'écran</p><h1>${esc(m.name)}</h1>${mine?`<div class="snotes"><div><b>Ta recette :</b> ${SFAC.map(f=>`${f.e} ${mine.x[f.k]||0}`).join(' · ')}</div><div><b>${mine.pct} %</b> propre · pourquoi ${mine.why?'✓':'✗'}</div></div>`:'<p>Tu n\'as pas joué cette mission.</p>'}`); }
    if(s.ph==='end'){ const rk=r?r.rk:null; return view('end',`<div class="big-ic">${rk===1?'🏆':rk===2?'🥈':rk===3?'🥉':'🎉'}</div><h1>${rk?`${rk}ᵉ sur ${r.of}`:'Partie terminée'}</h1><p style="font-size:1.2em;color:var(--ink)">${r?r.tot+' points':''}</p><p>Merci d'avoir joué !</p>`); }
    view('w'+s.ph,`<div class="big-ic"><span class="floaty">👀</span></div><h1>Regarde l'écran</h1>`); }
  function onMsg(m){ if(!m||m.t!=='st'||!m.s) return; P.st=m.s; P.lastSeen=Date.now();
    if(m.s.g==='sinner'){ if(m.s.ph==='brief'&&(S.res.length||S.mi||S.stage!=='set')){ S={mi:0,x:{chim:0,meca:0,temp:0,temps:0},stage:'set',res:[],last:null}; sSave(); P.key=''; }
      if(m.s.ph==='play'&&m.s.prog){ for(let k=(m.s.prog[id]||0);k<S.res.length;k++) sSend(k); } }
    if(P.joined&&!(m.s.ids||[]).includes(id)&&m.s.ph!=='end') Net.send({t:'join',id,name,team});
    if(m.s.ph==='q'&&P.myAns[m.s.n]!=null&&!(m.s.got||[]).includes(id)) Net.send({t:'ans',id,n:m.s.n,a:P.myAns[m.s.n]});
    if(m.s.ph==='q'&&P.myAns[m.s.n]==null){ P.deadline=Date.now()+(m.s.left||0)*1000; P.limit=m.s.limit||20; }
    render(); }
  (function tick(){ const tb=$('#ptb'); if(tb&&P.deadline){ const left=Math.max(0,(P.deadline-Date.now())/1000); tb.style.width=(left/P.limit*100)+'%'; } requestAnimationFrame(tick); })();
  joinForm();
  Net.open(JOIN,onMsg).then(mode=>{ Net.send({t:'hello',id}); if(name&&P.joined) Net.send({t:'join',id,name,team});
    setInterval(()=>{ if(!P.st||Date.now()-P.lastSeen>6000) Net.send({t:'hello',id}); },3000);
    if(mode!=='online'){ const i=$('#pinfo'); if(i) i.textContent=mode==='error'?'Connexion impossible : préviens Audrey.':'Mode test (même ordinateur).'; } render(); });
}
})();
</script>
